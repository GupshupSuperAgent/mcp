name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Repo checks (generated docs, manifests, links, leak scan)
        run: scripts/check.sh
      - name: Validate server.json against the registry schema
        run: |
          pip install --quiet check-jsonschema
          check-jsonschema --schemafile "$(python3 -c 'import json;print(json.load(open("server.json"))["$schema"])')" server.json
